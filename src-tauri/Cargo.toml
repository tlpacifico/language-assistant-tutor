[package]
name = "language-assistant-tutor"
version = "0.2.0"
description = "Tutor desktop de entrevistas comportamentais em inglês"
edition = "2021"
rust-version = "1.99"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
keyring = { version = "3.6.3", features = ["windows-native"] }
atomicwrites = "0.4.4"
cpal = "0.18.2"
hound = "3.5.1"
rodio = "0.23.0"
rubato = "5.0.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tauri = { version = "2.12.5", features = [] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
