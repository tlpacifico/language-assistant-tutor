[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-worker"
version = "0.1.0"
description = "Auxiliar local de transcricao (faster-whisper) e sintese (Kokoro) da fase 1"
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper==1.2.1",
    "kokoro==0.9.4",
    "misaki[en]==0.9.4",
    "soundfile>=0.12.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
audio-worker = "audio_worker.__main__:main"
audio-worker-prepare = "audio_worker.prepare:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: validacao real que exige pesos preparados fora do repositorio (audio-worker-prepare)",
]
